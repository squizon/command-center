<!DOCTYPE html>
<html>
<head><title>Generate App Icons</title></head>
<body>
<p>Icons will auto-download. Move them into your DailyCommandCenter folder.</p>
<canvas id="c192" width="192" height="192"></canvas>
<canvas id="c512" width="512" height="512"></canvas>
<script>
function drawIcon(canvasId, size) {
    const canvas = document.getElementById(canvasId);
    const ctx = canvas.getContext('2d');

    // Background with gradient
    const gradient = ctx.createLinearGradient(0, 0, size, size);
    gradient.addColorStop(0, '#9b7ed8');
    gradient.addColorStop(1, '#e88aaf');

    // Rounded square background
    const r = size * 0.2;
    ctx.beginPath();
    ctx.moveTo(r, 0);
    ctx.lineTo(size - r, 0);
    ctx.quadraticCurveTo(size, 0, size, r);
    ctx.lineTo(size, size - r);
    ctx.quadraticCurveTo(size, size, size - r, size);
    ctx.lineTo(r, size);
    ctx.quadraticCurveTo(0, size, 0, size - r);
    ctx.lineTo(0, r);
    ctx.quadraticCurveTo(0, 0, r, 0);
    ctx.closePath();
    ctx.fillStyle = gradient;
    ctx.fill();

    // White sparkle
    ctx.fillStyle = 'white';
    ctx.font = `${size * 0.45}px serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('✨', size/2, size/2);
}

drawIcon('c192', 192);
drawIcon('c512', 512);

// Auto-download
setTimeout(() => {
    let canvas = document.getElementById('c192');
    let link = document.createElement('a');
    link.download = 'icon-192.png';
    link.href = canvas.toDataURL();
    link.click();

    setTimeout(() => {
        canvas = document.getElementById('c512');
        link = document.createElement('a');
        link.download = 'icon-512.png';
        link.href = canvas.toDataURL();
        link.click();
    }, 500);
}, 500);
</script>
</body>
</html>
